name: MacMD
options:
  bundleIdPrefix: io.github.rodanr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: 0.3.1
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  MacMDKit:
    path: Packages/MacMDKit

targets:
  MacMD:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Web
      - path: App/Resources/Web
        type: folder
        buildPhase: resources
      # Shown in About → License / Terms & Privacy.
      - path: LICENSE
        buildPhase: resources
      - path: TERMS.md
        buildPhase: resources
    dependencies:
      - package: MacMDKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: MacMD
        CFBundleDisplayName: MacMD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Rodan Ramdam. Released under the MIT License."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_NAME: MacMD
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rodanr.macmd
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO

  MacMDTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: MacMD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rodanr.macmd.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MacMD.app/Contents/MacOS/MacMD
        BUNDLE_LOADER: $(TEST_HOST)

  MacMDUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [AppUITests]
    dependencies:
      - target: MacMD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rodanr.macmd.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacMD

schemes:
  MacMD:
    build:
      targets:
        MacMD: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: MacMDKit/MacMDKitTests
        - MacMDTests
        - MacMDUITests
    archive:
      config: Release
